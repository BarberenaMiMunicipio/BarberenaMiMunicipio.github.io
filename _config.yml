title: Barberena Mi Municipio
description: "Periodismo cívico hiperlocal en Barberena, Santa Rosa, Guatemala."
url: "https://barberenamimunicipio.top"

# Zona horaria oficial para Guatemala
timezone: America/Guatemala

# Publica entradas aunque su hora exacta caiga después del momento del build
# (evita que una entrada de "hoy" se oculte por diferencias de minutos/huso horario)
future: true

# Le decimos a Jekyll que no use ningún tema predefinido,
# porque ya tenés tu propio diseño en styles.css
theme: null

# Aplica automáticamente el layout "post" a todo lo que esté en _posts/,
# sin depender de que el CMS agregue "layout: post" en cada entrada
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      show_hero: false

# Que no procese estas carpetas/archivos como si fueran páginas
exclude:
  - README.md

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed

paginate: 10
paginate_path: "/blog/page:num/"

meses:
  - "Enero"
  - "Febrero"
  - "Marzo"
  - "Abril"
  - "Mayo"
  - "Junio"
  - "Julio"
  - "Agosto"
  - "Septiembre"
  - "Octubre"
  - "Noviembre"
  - "Diciembre"
