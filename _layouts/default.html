<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} - {% endif %}Barberena Mi Municipio</title>
  <meta name="description" content="{{ page.description | default: 'De tishudos para tishudos. Entérate de todo lo que pasa en Barberena y El Cerinal: noticias, obras y el día a día de nuestra gente.' }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Barberena Mi Municipio">
  <meta property="og:title" content="{{ page.title | default: 'Barberena Mi Municipio (BMM)' }}">
  <meta property="og:description" content="{{ page.description | default: 'De tishudos para tishudos. Entérate de todo lo que pasa en Barberena y El Cerinal: noticias, obras y el día a día de nuestra gente.' }}">
  <meta property="og:url" content="https://barberenamimunicipio.github.io{{ page.url }}">
  <meta property="og:image" content="https://barberenamimunicipio.github.io{{ page.hero_image | default: '/images/portada.webp' }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <link rel="canonical" href="https://barberenamimunicipio.github.io{{ page.url }}">
  <meta property="og:locale" content="es_GT">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title | default: 'Barberena Mi Municipio (BMM)' }}">
  <meta name="twitter:description" content="{{ page.description | default: 'Periodismo cívico hiperlocal en Barberena, Santa Rosa. De tishudos para tishudos.' }}">
  <meta name="twitter:image" content="https://barberenamimunicipio.github.io{{ page.hero_image | default: '/images/portada.webp' }}">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Lora:ital,wght@0,400;0,600;1,400&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <meta name="google-site-verification" content="rnI2_KGt4xMqGnZfDKDdzVr7GxNS1HKlzvXbb8d2ja4" />
<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="BMM" />
<link rel="manifest" href="/site.webmanifest" />
</head>
<body>

  {% include header.html %}

  {% unless page.show_hero == false %}
  <div class="hero">
    <img src="{{ page.hero_image | default: '/images/portada.webp' | relative_url }}" alt="{{ page.hero_alt | default: 'Barberena Mi Municipio' }}">
    <div class="hero-overlay"></div>
    <div class="hero-badge">{{ page.hero_badge | default: 'Barberena · Santa Rosa · Guatemala' }}</div>
  </div>
  {% endunless %}

  <main>
    {{ content }}
  </main>

  {% unless page.url == "/index.html" or page.url == "/" %}
  <div style="text-align:center; padding: 1.5rem 1rem 2.5rem;">
    <a href="/" onclick="if(document.referrer && document.referrer.includes(window.location.hostname)){history.back();return false;}" style="display:inline-flex;align-items:center;gap:0.5rem;color:#e8452a;text-decoration:none;font-family:'Barlow Condensed',sans-serif;font-size:0.95rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;">← Volver</a>
  </div>
  {% endunless %}

  {% include footer.html %}

  <script>
    const burger = document.getElementById('navBurger');
    const mobileMenu = document.getElementById('navMobile');
    burger.addEventListener('click', () => {
      const isOpen = mobileMenu.classList.toggle('open');
      burger.classList.toggle('open', isOpen);
      burger.setAttribute('aria-expanded', isOpen);
    });
    mobileMenu.querySelectorAll('a').forEach(a => {
      a.addEventListener('click', () => {
        mobileMenu.classList.remove('open');
        burger.classList.remove('open');
        burger.setAttribute('aria-expanded', 'false');
      });
    });
  </script>

</body>
</html>
