---
layout: default
---
<style>
  .post-articulo {
    max-width: 700px;
    margin: 0 auto;
    padding: 32px 24px;
  }

  .post-titulo-banner {
    background: linear-gradient(135deg, #ff7a45, var(--rojo, #e8452a));
    color: #fff;
    text-align: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    font-size: 2rem;
    line-height: 1.15;
    padding: 1.6rem 1.2rem;
    border-radius: 10px;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.25);
    margin-bottom: 0.75rem;
  }

  .post-fecha {
    color: #999;
    font-family: 'Barlow', sans-serif;
    text-align: center;
    margin-bottom: 1rem;
  }

  .post-articulo p {
    white-space: pre-line;
    margin-bottom: 1rem;
  }

  .post-articulo .post-imagen-destacada {
    width: 100%;
    max-width: 540px;
    aspect-ratio: 1080 / 1244;
    object-fit: contain;
    display: block;
    margin: 0 auto 1.5rem;
    border-radius: 8px;
  }
</style>

<article class="post-articulo">
  <div class="post-titulo-banner">{{ page.title }}</div>
  <p class="post-fecha"><small>{{ page.date | date: "%-d" }} de {{ site.meses[page.date | date: "%-m" | minus: 1] }} de {{ page.date | date: "%Y" }}</small></p>
  {% if page.image %}
    <img src="{{ page.image | relative_url }}" alt="{{ page.title }}" class="post-imagen-destacada">
  {% endif %}
  {{ content }}
</article>
