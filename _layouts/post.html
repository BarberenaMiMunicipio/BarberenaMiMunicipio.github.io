---
layout: default
---
<style>
  .post-articulo {
    max-width: 700px;
    margin: 0 auto;
    padding: 32px 24px;
  }

  .post-articulo h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
  }

  .post-fecha {
    color: #999;
    font-family: 'Barlow', sans-serif;
  }

  .post-articulo p {
    white-space: pre-line;
    margin-bottom: 1rem;
  }

  .post-imagen-destacada {
    width: 100%;
    max-width: 540px;
    aspect-ratio: 1080 / 1244;
    object-fit: contain;
    display: block;
    margin: 1.5rem auto;
    border-radius: 8px;
  }
</style>

<article class="post-articulo">
  <h1>{{ page.title }}</h1>
  <p class="post-fecha"><small>{{ page.date | date: "%d de %B de %Y" }}</small></p>
  {% if page.image %}
    <img src="{{ page.image | relative_url }}" alt="{{ page.title }}" class="post-imagen-destacada">
  {% endif %}
  {{ content }}
  <a href="/" onclick="if(document.referrer && document.referrer.includes(window.location.hostname)){history.back();return false;}" class="btn-volver">← Volver</a>
</article>
