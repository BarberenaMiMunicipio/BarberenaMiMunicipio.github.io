<div class="news-ticker">
  <div class="ticker-track" id="tickerTrack">
    <span class="ticker-item">Cargando noticias de Barberena...</span>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    fetch('/feed.xml')
      .then(response => response.text())
      .then(str => new window.DOMParser().parseFromString(str, "text/xml"))
      .then(data => {
        const items = data.querySelectorAll("item");
        const track = document.getElementById('tickerTrack');
        track.innerHTML = ""; // Limpiar texto de carga
        
        items.forEach((item, index) => {
          if (index < 6) { // Limitar a las últimas 6 noticias
            const title = item.querySelector("title").textContent;
            const link = item.querySelector("link").textContent;
            
            const a = document.createElement('a');
            a.href = link;
            a.textContent = title;
            a.className = "ticker-item";
            track.appendChild(a);
          }
        });
      })
      .catch(err => console.error("Error al cargar el feed:", err));
  });
</script>
