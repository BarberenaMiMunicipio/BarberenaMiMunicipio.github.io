<div class="news-ticker">
  <div class="ticker-track" id="tickerTrack">
    <span class="ticker-item">Cargando noticias de Barberena...</span>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    fetch('/assets/data/ticker.json')
      .then(response => response.json())
      .then(data => {
        const track = document.getElementById('tickerTrack');
        track.innerHTML = ""; // Limpiar texto de carga
        
        if (data.length === 0) {
          track.innerHTML = '<span class="ticker-item">No hay noticias recientes en este momento.</span>';
          return;
        }

        // Función para poblar los elementos
        const renderItems = () => {
          data.forEach(item => {
            const a = document.createElement('a');
            a.href = item.url;
            a.textContent = item.text;
            a.className = "ticker-item";
            
            if (item.cat === "denuncia") {
              a.style.borderLeft = "3px solid #e8452a";
              a.style.paddingLeft = "8px";
            }
            
            track.appendChild(a);
          });
        };

        // Duplicamos los elementos para lograr el efecto de bucle infinito perfecto
        renderItems();
        renderItems(); 
      })
      .catch(err => {
        console.error("Error al cargar el ticker JSON:", err);
        document.getElementById('tickerTrack').innerHTML = '<span class="ticker-item">Información local al día.</span>';
      });
  });
</script>
