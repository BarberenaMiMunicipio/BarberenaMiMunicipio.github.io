<div class="news-ticker">
  <div class="ticker-track" id="tickerTrack">
    <span class="ticker-item">Cargando noticias de Barberena...</span>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {

  fetch('/assets/data/ticker.json')
    .then(response => response.json())
    .then(data => {

      const track = document.getElementById('tickerTrack');
      track.innerHTML = "";

      if (data.length === 0) {
        track.innerHTML =
          '<span class="ticker-item">No hay noticias recientes en este momento.</span>';
        return;
      }

      // Crear las noticias
      data.forEach(item => {
        const a = document.createElement('a');
        a.href = item.url;
        a.textContent = item.text;
        a.className = "ticker-item";

        if (item.cat === "denuncia") {
          a.classList.add("ticker-denuncia");
        }

        track.appendChild(a);
      });

      // Duplicar las noticias para crear el bucle (los clones no
      // deben ser leídos dos veces por lectores de pantalla)
      const items = Array.from(track.children);
      items.forEach(item => {
        const clone = item.cloneNode(true);
        clone.setAttribute('aria-hidden', 'true');
        track.appendChild(clone);
      });

      /*
       * Mientras más contenido haya, más tarda el recorrido: en vez de
       * confiar en una variable CSS (que el navegador no siempre relee
       * una vez que la animación ya arrancó), inyectamos directamente
       * un @keyframes nuevo con la distancia y la duración exactas ya
       * calculadas. Esto es lo que garantiza que el movimiento arranque
       * bien desde el primer render.
       */
      function calcularVelocidad() {
        // Si la persona pidió reducir movimiento en su sistema, no
        // animamos nada — se queda una lista estática y desplazable.
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          const styleId = 'bmm-ticker-keyframes';
          const anterior = document.getElementById(styleId);
          if (anterior) anterior.remove();
          track.closest('.news-ticker').style.overflowX = 'auto';
          return;
        }

        const distancia = track.scrollWidth / 2; // una sola "vuelta" de noticias

        const pixelesPorSegundo =
          window.innerWidth <= 640 ? 24 : 32;

        let duracion = distancia / pixelesPorSegundo;
        duracion = Math.max(duracion, 45); // nunca menos de 45s

        const styleId = 'bmm-ticker-keyframes';
        const anterior = document.getElementById(styleId);
        if (anterior) anterior.remove();

        const style = document.createElement('style');
        style.id = styleId;
        style.textContent =
          '@keyframes scrollTicker { from { transform: translateX(0); } ' +
          'to { transform: translateX(-' + distancia + 'px); } }' +
          '#tickerTrack { animation: scrollTicker ' + duracion + 's linear infinite; }';
        document.head.appendChild(style);
      }

      // Calcular al cargar, y de nuevo cuando las fuentes terminen de
      // cargar (Barlow puede cambiar el ancho del texto al llegar)
      setTimeout(calcularVelocidad, 100);
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(calcularVelocidad);
      }

      // Recalcular si cambia el tamaño de pantalla
      let resizeTimeout;
      window.addEventListener('resize', function () {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(calcularVelocidad, 200);
      });

    })
    .catch(err => {
      console.error("Error al cargar el ticker JSON:", err);
      document.getElementById('tickerTrack').innerHTML =
        '<span class="ticker-item">Información local al día.</span>';
    });

});
</script>
