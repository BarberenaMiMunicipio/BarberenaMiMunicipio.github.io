<div class="news-ticker">
  <div class="ticker-track" id="tickerTrack">
    <span class="ticker-item">Cargando noticias de Santa Rosa...</span>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {

  fetch('/assets/data/ticker.json')
    .then(response => response.json())
    .then(data => {

      const track = document.getElementById('tickerTrack');

      track.innerHTML = "";

      if (data.length === 0) {
        track.innerHTML =
          '<span class="ticker-item">No hay noticias recientes en este momento.</span>';
        return;
      }

      // Crear las noticias
      data.forEach(item => {

        const a = document.createElement('a');

        a.href = item.url;
        a.textContent = item.text;
        a.className = "ticker-item";

        if (item.cat === "denuncia") {
          a.classList.add("ticker-denuncia");
        }

        track.appendChild(a);
      });

      // Duplicar las noticias para crear el bucle
      const items = Array.from(track.children);

      items.forEach(item => {
        const clone = item.cloneNode(true);
        clone.setAttribute('aria-hidden', 'true');
        track.appendChild(clone);
      });

      /*
       * Calculamos cuánto texto existe.
       *
       * Mientras más contenido haya,
       * más tiempo tardará el recorrido.
       */
      function calcularVelocidad() {

        const distancia = track.scrollWidth / 2;

        // Velocidad cómoda para lectura
        const pixelesPorSegundo =
          window.innerWidth <= 640 ? 24 : 32;

        let duracion = distancia / pixelesPorSegundo;

        // Nunca menos de 45 segundos
        duracion = Math.max(duracion, 45);

        track.style.setProperty(
          '--ticker-duration',
          duracion + 's'
        );
      }

      // Calcular al cargar
      setTimeout(calcularVelocidad, 100);

      // Recalcular si cambia el tamaño
      window.addEventListener('resize', calcularVelocidad);

      // Recalcular cuando carguen las fuentes
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(calcularVelocidad);
      }

    })

    .catch(err => {

      console.error(
        "Error al cargar el ticker JSON:",
        err
      );

      document.getElementById('tickerTrack').innerHTML =
        '<span class="ticker-item">Información local al día.</span>';

    });

});
        </script>
